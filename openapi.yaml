openapi: 3.0.3
info:
  title: Arbetsgivare API
  version: 1.1.1
  description: API för att hämta arbetsgivar- och löneinformation för personer

paths:
  /arbetsgivare/{personnummer}:
    get:
      tags: [ArbetsgivareController]
      operationId: getArbetsgivare
      summary: Hämta information om personens arbetsgivare
      description: Hämta information om personens arbetsgivare
      parameters:
        - name: personnummer
          in: path
          required: true
          description: Svenskt personnummer 12 siffror
          schema:
            $ref: '#/components/schemas/Persnr'
      responses:
        '200':
          description: Förfrågan genomförd OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  anstallningar:
                    type: array
                    items:
                      $ref: '#/components/schemas/Anstallning'
              examples:
                tvaAnstallningar:
                  summary: Exempel med två anställningar
                  value:
                    anstallningar:
                      - startdag: "2020-01-01"
                        slutdag: "2021-06-30"
                        arbetstid: 75
                        organisation:
                          nummer: "123456-7890"
                          namn: "Region Dalarna"
                      - startdag: "2021-07-01"
                        slutdag: null
                        arbetstid: 100
                        organisation:
                          nummer: "987654-3210"
                          namn: "Demo AB"
        '400':
          description: Bad request (t.ex. felaktigt format på personnummer)
        '404':
          description: Finns ingen person för personnummer

  /arbetsgivare/{personnummer}/specificerad-lon:
    get:
      tags: [ArbetsgivareController]
      operationId: getSpecificeradLon
      summary: Hämta specificerad lön för en person
      description: |
        Hämtar aggregerad löneinformation för en person under en angiven period.
        Returnerar summan av alla lönerader (grundlön, tillägg, avdrag).
      parameters:
        - name: personnummer
          in: path
          required: true
          description: Svenskt personnummer 12 siffror
          schema:
            $ref: '#/components/schemas/Persnr'
        - name: fromDatum
          in: query
          required: true
          description: Periodens startdatum
          schema:
            type: string
            format: date
            example: "2025-02-01"
        - name: tomDatum
          in: query
          required: true
          description: Periodens slutdatum
          schema:
            type: string
            format: date
            example: "2025-02-28"
      responses:
        '200':
          description: Specificerad lön hämtad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificeradLon'
              examples:
                normalLon:
                  summary: Exempel med 4 lönerader
                  value:
                    personnummer: "19850101-1234"
                    periodFrom: "2025-02-01"
                    periodTom: "2025-02-28"
                    lonesumma: 40000.0
                    lonerader:
                      - typ: "GRUNDLON"
                        beskrivning: "Månadslön"
                        belopp: 42000.0
                      - typ: "TILLAGG"
                        beskrivning: "OB-tillägg"
                        belopp: 2000.0
                      - typ: "AVDRAG"
                        beskrivning: "Frånvaro sjukdom"
                        belopp: -2000.0
                      - typ: "AVDRAG"
                        beskrivning: "Frånvaro VAB"
                        belopp: -2000.0
                    organisation:
                      nummer: "556677-8899"
                      namn: "Region Dalarna"
        '400':
          description: Bad request (t.ex. felaktigt format på personnummer eller datum)
        '404':
          description: Finns ingen person eller löneinformation för personnummer

components:
  schemas:
    Persnr:
      type: string
      pattern: '^\d{8}-\d{4}$'
      example: "19850101-1234"

    Anstallning:
      type: object
      properties:
        startdag:
          type: string
          format: date
          description: Startdatum för anställningen
          example: "2020-01-01"
        slutdag:
          type: string
          format: date
          nullable: true
          description: Slutdatum för anställningen, null om pågående
          example: "2020-12-12"
        arbetstid:
          $ref: '#/components/schemas/Arbetstid'
        organisation:
          $ref: '#/components/schemas/Organisation'

    Organisation:
      type: object
      properties:
        nummer:
          type: string
          description: Organisationsnummer
          example: "556677-8899"
        namn:
          type: string
          description: Organisationsnamn
          example: "Region Dalarna"

    Arbetstid:
      type: integer
      minimum: 0
      maximum: 100
      description: Ett procentvärde mellan 0 och 100
      example: 100

    SpecificeradLon:
      type: object
      description: Aggregerad löneinformation för en period
      required:
        - personnummer
        - periodFrom
        - periodTom
        - lonesumma
      properties:
        personnummer:
          $ref: '#/components/schemas/Persnr'
        periodFrom:
          type: string
          format: date
          description: Periodens startdatum
          example: "2025-02-01"
        periodTom:
          type: string
          format: date
          description: Periodens slutdatum
          example: "2025-02-28"
        lonesumma:
          type: number
          format: double
          description: Summan av alla lönerader för perioden
          example: 40000.0
        lonerader:
          type: array
          description: Detaljerade lönerader
          items:
            $ref: '#/components/schemas/Lonerad'
        organisation:
          $ref: '#/components/schemas/Organisation'

    Lonerad:
      type: object
      description: En enskild lönerad (grundlön, tillägg eller avdrag)
      required:
        - typ
        - belopp
      properties:
        typ:
          $ref: '#/components/schemas/LoneradTyp'
        beskrivning:
          type: string
          description: Beskrivning av löneraden
          example: "Månadslön"
        belopp:
          type: number
          format: double
          description: Belopp i kronor (negativt för avdrag)
          example: 42000.0

    LoneradTyp:
      type: string
      enum:
        - GRUNDLON
        - TILLAGG
        - AVDRAG
      description: |
        Typ av lönerad:
        * GRUNDLON - Grundlön/månadslön
        * TILLAGG - Tillägg (OB, övertid, etc.)
        * AVDRAG - Avdrag (frånvaro, etc.)
      example: "GRUNDLON"